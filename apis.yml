aid: hashflow
name: Hashflow
description: >-
  Hashflow is a decentralized exchange (DEX) and the leading request-for-quote
  (RFQ) trading platform in crypto. Instead of an automated market maker (AMM)
  pricing curve, Hashflow brokers signed, off-chain-priced quotes from a network
  of professional market makers, giving traders zero-slippage, MEV-protected swaps
  across EVM chains and Solana, including cross-chain trades. Market makers publish
  price levels and respond to RFQs with EIP-712 signed quotes that settle on-chain
  via the HashflowRouter contract. Developers integrate through the Taker API v3
  (market-makers, price-levels, rfq, and restrictions endpoints) and market-maker
  tooling, with first-party JavaScript and Python SDKs.
